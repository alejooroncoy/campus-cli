# Compila y corre los tests en cada PR y en cada push a main.
#
# El repo es público y acepta PRs de fuera, pero hasta ahora nadie comprobaba
# nada antes de mergear: el PR #15 entró con 773 líneas y sus tests los corrió
# una persona a mano. Basta con que una vez se olvide para que main quede roto
# sin que salte ninguna alarma.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la ejecución anterior: revisar un
# commit que ya quedó obsoleto no dice nada y ocupa la cola.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  build-and-test:
    runs-on: ubuntu-latest
    # Playwright descarga Chromium en el postinstall y aquí no hay navegador que
    # abrir: el login contra el SSO ocurre en la máquina del estudiante. Bajarlo
    # costaría minutos por ejecución sin comprobar nada.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      POSTHOG_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # La misma mayor que usa el Dockerfile de los directorios MCP, para
          # que un fallo aquí signifique lo mismo que un fallo allí.
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm --prefix site ci
      - run: npm --prefix site audit --audit-level=high
      - run: npm --prefix site run build
