# Compila y corre los tests en cada PR y en cada push a main.
#
# El repo es público y acepta PRs de fuera, pero hasta ahora nadie comprobaba
# nada antes de mergear: el PR #15 entró con 773 líneas y sus tests los corrió
# una persona a mano. Basta con que una vez se olvide para que main quede roto
# sin que salte ninguna alarma.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la ejecución anterior: revisar un
# commit que ya quedó obsoleto no dice nada y ocupa la cola.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Install browsers explicitly after the non-browser checks. Tests use local
    # fixtures; university SSO and production credentials are never needed.
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      POSTHOG_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # La misma mayor que usa el Dockerfile de los directorios MCP, para
          # que un fallo aquí signifique lo mismo que un fallo allí.
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm --prefix site ci
      - run: npm --prefix site audit --audit-level=high
      - run: npm --prefix site run build
      - run: npm --prefix site run check
      - run: npm --prefix site run test:app
      - run: npm --prefix site run test:analytics
      - name: Configure Ubuntu dependency downloads
        run: |
          printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "1";\n' | sudo tee /etc/apt/apt.conf.d/99-campus-ci-network >/dev/null
          # The Azure mirror repeatedly stalls while installing browser fonts.
          # Keep APT signature verification and use Ubuntu's official HTTPS mirror.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - name: Install site browsers (Chromium and WebKit)
        run: npm --prefix site exec -- playwright install --with-deps chromium webkit
        timeout-minutes: 5
      - name: Mobile replies and nested comments (Chromium and iPhone WebKit)
        run: npm --prefix site run test:review-replies
        timeout-minutes: 3
      - name: Upload mobile thread screenshots and checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-review-threads
          path: site/.test-results/review-replies/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Browser PDF reading continuation
        run: CAMPUS_BROWSER_TESTS=1 node --import tsx --test tests/research-browser.test.ts
      - run: npm --prefix site run test:analytics:transport

      - name: Turnitin public pause and reactivation
        run: |
          node site/scripts/verify-turnitin-feature.mjs
          node site/scripts/verify-turnitin-visibility.mjs
          CAMPUS_TURNITIN_SERVICE_ENABLED=true npm --prefix site run build
          CAMPUS_TURNITIN_SERVICE_ENABLED=true node site/scripts/verify-turnitin-feature.mjs
          CAMPUS_TURNITIN_SERVICE_ENABLED=true node site/scripts/verify-turnitin-visibility.mjs
