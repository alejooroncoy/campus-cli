name: Publish site from checked main

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-site-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: Production
      url: https://campuscli.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Publish only a ready Git build of checked current main
        env:
          SITE_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_SITE_PUBLISH_TOKEN: ${{ secrets.VERCEL_SITE_PUBLISH_TOKEN }}
        run: node scripts/publish-site-production.mjs
